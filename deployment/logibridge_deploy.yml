---
- name: Deploy LogiBridge inference
  hosts: edge
  become: true
  gather_facts: false
  vars:
    model_variant: training/models/m2_ptq_int8.tflite
    image_tag: latest
    runtime_dir: /opt/logibridge
  tasks:
    - name: Ensure runtime directory
      ansible.builtin.file:
        path: "{{ runtime_dir }}"
        state: directory
        owner: 1000
        group: 1000
        mode: "0755"

    - name: Copy model and stats
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.src }}"
        dest: "{{ runtime_dir }}/{{ item.dest }}"
        owner: 1000
        group: 1000
        mode: "0644"
      loop:
        - {src: "{{ model_variant }}", dest: model.tflite}
        - {src: data_pipeline/training_stats.npy, dest: training_stats.npy}
      register: model_copy

    - name: Copy drift reference
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/reference_dist.json"
        dest: "{{ runtime_dir }}/reference_dist.json"
        owner: 1000
        group: 1000
        mode: "0644"
      register: ref_copy

    - name: Stop changed inference container
      community.docker.docker_container:
        name: inference_engine
        state: stopped
      when: model_copy.changed or ref_copy.changed

    - name: Pull inference image
      community.docker.docker_image:
        name: "localhost:5000/logibridge-inference:{{ image_tag }}"
        source: pull

    - name: Run inference container
      community.docker.docker_container:
        name: inference_engine
        image: "localhost:5000/logibridge-inference:{{ image_tag }}"
        state: started
        restart: "{{ model_copy.changed or ref_copy.changed }}"
        restart_policy: unless-stopped
        networks:
          - name: logiedge_net
        env:
          MODEL_PATH: /opt/logibridge/model.tflite
          STATS_PATH: /opt/logibridge/training_stats.npy
          ALERT_DB: /opt/logibridge/alerts.db
          TRUCK_ID: "{{ truck_id | default('T01') }}"
          MQTT_HOST: mqtt_broker
          MQTT_PORT: "1883"
          UPLINK_HOST: "{{ uplink_host | default('ops_broker') }}"
        volumes:
          - "{{ runtime_dir }}:/opt/logibridge:rw"

    - name: Verify healthy inference container
      community.docker.docker_container_info:
        name: inference_engine
      register: info
      until: info.container.State.Health.Status == 'healthy'
      retries: 10
      delay: 3
      changed_when: false
