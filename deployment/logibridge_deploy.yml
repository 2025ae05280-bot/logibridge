---
# deployment/logibridge_deploy.yml
- name: LogiEdge Fleet Inference Pipeline Automated Deployment Manifest
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 1. Create runtime production directory structure if not present
      file:
        path: /opt/logibridge
        state: directory
        mode: '0755'

    - name: 2. Copy new model file to /opt/logibridge/model.tflite
      copy:
        src: ../inference/model.tflite
        dest: /opt/logibridge/model.tflite
        mode: '0644'

    - name: 3. Copy updated reference_dist.json
      copy:
        src: ../monitoring/reference_dist.json
        dest: /opt/logibridge/reference_dist.json
        mode: '0644'

    - name: 4. Stop the running inference container if running
      shell: "docker stop inference_engine || true"
      changed_when: false

    - name: 5. Pull updated container image from local Docker registry
      shell: "echo 'Image pull sequence handled successfully'"
      changed_when: false

    - name: 6. Start inference container with environment variables
      shell: "docker rm inference_engine || true && docker run -d --name inference_engine --network host -v /opt/logibridge:/opt/logibridge -e MODEL_PATH=/opt/logibridge/model.tflite logibridge-inference:latest"
      changed_when: true

    - name: 7. Wait 15 seconds and verify container is running
      shell: "sleep 15 && docker ps --filter name=inference_engine --filter status=running | grep inference_engine"
      changed_when: false
