services:
  mqtt_broker:
    image: eclipse-mosquitto:2.0
    container_name: logiedge_broker
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [logiedge_net]

  ops_broker:
    image: eclipse-mosquitto:2.0
    container_name: logiedge_ops_broker
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./config/ops_broker.conf:/mosquitto/config/mosquitto.conf:ro
      - ops_broker_data:/mosquitto/data
    restart: unless-stopped
    networks: [logiedge_net]

  inference_engine:
    profiles: [dev]
    build:
      context: .
      dockerfile: inference/Dockerfile
    container_name: inference_engine
    environment:
      MODEL_PATH: /models/model.tflite
      STATS_PATH: /opt/logibridge/training_stats.npy
      ALERT_DB: /var/lib/logibridge/alerts.db
      UPLINK_HOST: ${UPLINK_HOST:-ops_broker}
      MODEL_VERSION: ${MODEL_VERSION:-model}
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${MODEL_FILE:-./inference/model.tflite}
        target: /models/model.tflite
        read_only: true
      - ./data_pipeline/training_stats.npy:/opt/logibridge/training_stats.npy:ro
      - inference_data:/var/lib/logibridge
    depends_on:
      mqtt_broker:
        condition: service_healthy
      ops_broker:
        condition: service_started
    restart: unless-stopped
    networks: [logiedge_net]

  telemetry_simulator:
    build:
      context: .
      dockerfile: inference/Dockerfile
    container_name: logiedge_simulator
    command: ["python", "-u", "-m", "data_pipeline.simulator", "--anomaly", "${SIM_ANOMALY:-none}", "--truck-id", "T01", "--fast", "${SIM_FAST:-1}"]
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_HOST: mqtt_broker
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      mqtt_broker:
        condition: service_healthy
    restart: unless-stopped
    networks: [logiedge_net]

networks:
  logiedge_net:
    name: logiedge_net
    driver: bridge

volumes:
  broker_data:
  ops_broker_data:
  inference_data:
