services:
  mqtt_broker:
    image: eclipse-mosquitto:2.0
    container_name: logiedge_broker
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    networks:
      - logiedge_net

  inference_engine:
    image: logibridge-inference:latest
    container_name: inference_engine
    environment:
      - MODEL_PATH=/opt/logibridge/model.tflite
      - PYTHONUNBUFFERED=1
    volumes:
      - /opt/logibridge:/opt/logibridge
    depends_on:
      - mqtt_broker
    restart: unless-stopped
    networks:
      - logiedge_net

  telemetry_simulator:
    image: logibridge-inference:latest
    container_name: logiedge_simulator
    command: ["python", "-u", "data_pipeline/simulator.py", "--anomaly", "temp_drift"]
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - mqtt_broker
    restart: unless-stopped
    networks:
      - logiedge_net

networks:
  logiedge_net:
    driver: bridge
